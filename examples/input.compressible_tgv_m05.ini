# Subsonic compressible Taylor-Green vortex, M0=0.5, Re=500
# Run from the repository root with something like:
#   ./src/tps --runFile examples/input.compressible_tgv_m05.ini

[solver]
type = flow

[flow]
mesh = test/meshes/periodic-cube.mesh
order = 4
integrationRule = 1
basisType = 1
maxIters = 100
outputFreq = 10
timingFreq = 10
useRoe = 1
refLength = 0.3183098861837907
equation_system = navier-stokes
fluid = dry_air
specific_heat_ratio = 1.4
gas_constant = 1.0
# Set automatically from tgvRe when initialConditions/tgvUsePaperSutherland = True.
# viscosityMultiplier = rho0*U0*L/Re = 6.366197723675814e-4 for Re=500 with L=1/pi.
bulkViscosityMultiplier = 0.0

[periodicity]
enablePeriodic = True
xTrans = 2.0
yTrans = 2.0
zTrans = 2.0

[time]
cfl = 0.05
integrator = rk4
enableConstantTimestep = True
dt_fixed = 1.0e-4

[initialConditions]
type = compressible_tgv
tgvRho0 = 1.0
tgvU0 = 1.0
tgvMach = 0.5
tgvRe = 500.0
tgvLength = 0.3183098861837907
tgvUsePaperSutherland = True
# Optional overrides. If omitted, p0=rho0*U0^2/(gamma*M^2) and T0=p0/(rho0*R).
# tgvPressure0 = 2.857142857142857
# tgvTemperature0 = 2.857142857142857

[tgvDiagnostics]
enabled = True
frequency = 1
file = tgv_diagnostics.csv

[io]
outdirBase = tgv_m05_output
enableRestart = False
restartMode = standard

[boundaryConditions]
numWalls = 0
numInlets = 0
numOutlets = 0
