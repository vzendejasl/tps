# Compressible Taylor-Green vortex on [0,1]^3
# Re = 400, M0 = 1.25, effective 32^3 mesh via a pre-periodic 4x4x4 base mesh and 3 uniform refinements
# 5-step smoke case intended for a 4-rank run from the TPS repository root.
# This smoke input uses order = 1 so the validation run completes quickly on a workstation.
#   mpirun -np 4 build-macos/src/tps --runFile examples/input.compressible_tgv_re400_m125_32cubed_5step_4p.ini

[solver]
type = flow

[flow]
mesh = test/meshes/periodic_cube_01_4x4x4.mesh
order = 1
integrationRule = 1
basisType = 1
maxIters = 5
outputFreq = 1
timingFreq = 1
useRoe = 1
refLength = 0.15915494309189535
refinement_levels = 3
equation_system = navier-stokes
fluid = dry_air
specific_heat_ratio = 1.4
gas_constant = 1.0
bulkViscosityMultiplier = 0.0

[periodicity]
enablePeriodic = False

[time]
cfl = 0.05
integrator = rk4
enableConstantTimestep = True
dt_fixed = 1.0e-4

[initialConditions]
type = compressible_tgv
tgvRho0 = 1.0
tgvU0 = 1.0
tgvMach = 1.25
tgvRe = 400.0
tgvLength = 0.15915494309189535
tgvUsePaperSutherland = True

[tgvDiagnostics]
enabled = True
frequency = 1
file = tgv_diagnostics.csv

[io]
outdirBase = tgv_re400_m125_32cubed_5step_4p
enableRestart = False
restartMode = standard

[boundaryConditions]
numWalls = 0
numInlets = 0
numOutlets = 0
