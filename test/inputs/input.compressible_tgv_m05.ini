[solver]
type = flow

[flow]
mesh = meshes/periodic-cube.mesh
order = 4
integrationRule = 1
basisType = 1
maxIters = 1
outputFreq = 1
timingFreq = 1
useRoe = 1
refLength = 0.3183098861837907
equation_system = navier-stokes
fluid = dry_air
specific_heat_ratio = 1.4
gas_constant = 1.0
bulkViscosityMultiplier = 0.0

[periodicity]
enablePeriodic = True
xTrans = 2.0
yTrans = 2.0
zTrans = 2.0

[time]
cfl = 0.05
integrator = rk4
enableConstantTimestep = True
dt_fixed = 1.0e-4

[initialConditions]
type = compressible_tgv
tgvRho0 = 1.0
tgvU0 = 1.0
tgvMach = 0.5
tgvRe = 500.0
tgvLength = 0.3183098861837907
tgvUsePaperSutherland = True

[tgvDiagnostics]
enabled = True
frequency = 1
file = tgv_diagnostics.csv

[io]
outdirBase = tgv_m05_output_test
enableRestart = False
restartMode = standard

[boundaryConditions]
numWalls = 0
numInlets = 0
numOutlets = 0
